[package]
name = "ba_items"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Black Anvil item system: catalog, inventory, equipment, and pure logic"

[dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.8"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
insta = { version = "1.41", features = ["ron"] }
