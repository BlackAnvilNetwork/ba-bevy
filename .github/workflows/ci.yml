name: ci

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates + client
        run: cargo check -p ba_protocol -p ba_combat -p ba_zone_server -p black_anvil
      - name: Shared protocol & zone unit tests
        run: cargo test -p ba_protocol -p ba_zone_server

  zone-smoke:
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build zone server
        run: cargo build -p ba_zone_server
      - name: Install smoke deps
        working-directory: scripts
        run: npm ci
      - name: Run zone smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target\debug\ba_zone_server.exe" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $c = New-Object System.Net.Sockets.TcpClient
                $c.Connect("127.0.0.1", 8787)
                $c.Close()
                $ok = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "zone server did not listen" }
            node scripts/smoke-zone-realtime.mjs
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Character Studio dependencies
        working-directory: character-studio
        run: npm ci --legacy-peer-deps
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: Build embedded Black Anvil Studio
        working-directory: launcher
        run: npm run studio:build
      - name: Check native launcher commands
        run: cargo check --manifest-path launcher/src-tauri/Cargo.toml
      - name: Test launcher character validation and revision logic
        run: cargo test --manifest-path launcher/src-tauri/Cargo.toml
