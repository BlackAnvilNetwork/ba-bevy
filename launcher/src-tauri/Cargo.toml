# Independent of the Bevy workspace at repo root.
[workspace]

[package]
name = "launcher"
version = "0.0.0"
description = "Black Anvil launcher — Character Studio host"
authors = ["Black Anvil Network"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.1", features = ["shell-open"] }
base64 = "0.22"
sha2 = "0.10"
atomicwrites = "0.4"
dirs-next = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
