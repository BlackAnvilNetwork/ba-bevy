[workspace]
resolver = "2"
members = [
    ".",
    "crates/ba_pixel_core",
    "crates/ba_pixel_geometry",
    "crates/ba_pixel_sim",
    "crates/ba_protocol",
    "crates/ba_combat",
    "crates/ba_zone_server",
    "crates/ba_gateway",
]
exclude = ["launcher/src-tauri"]

[package]
name = "black_anvil"
version = "0.1.0"
edition = "2021"
description = "Black Anvil opening slice — Bevy runtime"

[dependencies]
bevy = { version = "0.20", features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", features = ["small_rng"] }
ba_pixel_core = { path = "crates/ba_pixel_core" }
ba_pixel_geometry = { path = "crates/ba_pixel_geometry" }
ba_pixel_sim = { path = "crates/ba_pixel_sim" }
ba_protocol = { path = "crates/ba_protocol" }
ba_combat = { path = "crates/ba_combat" }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
